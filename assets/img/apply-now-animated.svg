<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -10 250 130" role="img" aria-label="Apply now">
  <style>
    .cls-1 { fill: #2c2b32; }
    .cls-2 { fill: #b5c082; }
    .cls-3 { fill: #f6e6c4; }
    .cls-4 { fill: #425636; }
    .cls-5 { fill: #b35d38; }

    /* One shared loop: hand winds up, taps the knob, knob squashes,
       pill gets nudged left, motion lines pop, ripple spreads. */
    :root { --t: 2.8s; }

    .hand   { transform-box: fill-box; transform-origin: center;
              animation: hand var(--t) cubic-bezier(.45,0,.25,1) infinite; }
    .knob   { transform-box: fill-box; transform-origin: center;
              animation: knob var(--t) ease-out infinite; }
    .core   { transform-box: fill-box; transform-origin: center;
              animation: core var(--t) ease-out infinite; }
    .pill   { animation: pill var(--t) cubic-bezier(.3,1.6,.5,1) infinite; }
    .ripple { transform-box: fill-box; transform-origin: center; opacity: 0;
              fill: none; stroke: #b5c082; stroke-width: 2;
              animation: ripple var(--t) ease-out infinite; }
    .spark  { animation-duration: var(--t); animation-iteration-count: infinite;
              animation-timing-function: ease-out; }
    .spark-1 { animation-name: spark1; }
    .spark-2 { animation-name: spark2; animation-delay: .05s; }
    .spark-3 { animation-name: spark3; animation-delay: .1s; }

    @keyframes hand {
      0%, 20%  { transform: translate(0, 0) rotate(0deg); }
      34%      { transform: translate(4px, 5px) rotate(3deg); }    /* wind up */
      42%      { transform: translate(-1.5px, -2px) rotate(-1deg); } /* tap */
      50%      { transform: translate(0.5px, 0.5px); }
      58%, 100%{ transform: translate(0, 0); }
    }
    @keyframes knob {
      0%, 40%  { transform: scale(1); }
      45%      { transform: scale(.9); }
      55%      { transform: scale(1.04); }
      64%, 100%{ transform: scale(1); }
    }
    @keyframes core {
      0%, 40%  { transform: scale(1); }
      46%      { transform: scale(.78); }
      58%      { transform: scale(1.06); }
      68%, 100%{ transform: scale(1); }
    }
    @keyframes pill {
      0%, 42%  { transform: translateX(0); }
      48%      { transform: translateX(-3px); }
      62%, 100%{ transform: translateX(0); }
    }
    @keyframes ripple {
      0%, 42%  { transform: scale(1); opacity: 0; }
      44%      { opacity: .9; }
      80%, 100%{ transform: scale(1.3); opacity: 0; }
    }
    /* each line shoots outward along its own radial direction */
    @keyframes spark1 {
      0%, 44%  { transform: translate(0, 0); opacity: 1; }
      50%      { transform: translate(1px, .15px); opacity: .6; }
      58%      { transform: translate(-4px, -.6px); opacity: 1; }
      74%, 100%{ transform: translate(0, 0); opacity: 1; }
    }
    @keyframes spark2 {
      0%, 44%  { transform: translate(0, 0); opacity: 1; }
      50%      { transform: translate(.8px, .65px); opacity: .6; }
      58%      { transform: translate(-3.1px, -2.5px); opacity: 1; }
      74%, 100%{ transform: translate(0, 0); opacity: 1; }
    }
    @keyframes spark3 {
      0%, 44%  { transform: translate(0, 0); opacity: 1; }
      50%      { transform: translate(.35px, 1px); opacity: .6; }
      58%      { transform: translate(-1.3px, -3.8px); opacity: 1; }
      74%, 100%{ transform: translate(0, 0); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hand, .knob, .core, .pill, .ripple, .spark { animation: none; }
    }
  </style>

  <!-- motion lines -->
  <g class="spark spark-1">
    <rect class="cls-4" x="2.0664701" y="28.4040334" width="3.1477532" height="7.322646" rx="1.5738755" ry="1.5738755" transform="translate(-28.6169278 31.112756) rotate(-81.8314723)"/>
  </g>
  <g class="spark spark-2">
    <rect class="cls-4" x="10.2207762" y="10.5373665" width="3.147753" height="7.322646" rx="1.5738739" ry="1.5738739" transform="translate(-6.6599443 13.8186063) rotate(-49.1041888)"/>
  </g>
  <g class="spark spark-3">
    <rect class="cls-4" x="26.7400761" y="-.0842814" width="3.147753" height="7.3226459" rx="1.5738752" ry="1.5738752" transform="translate(.1402035 8.1284149) rotate(-16.3769715)"/>
  </g>

